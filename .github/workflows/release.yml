# Builds the app from the repository source in clean GitHub environments
# (VPN.exe on Windows, VPN-linux-x86_64 on Linux, VPN-macos.zip on macOS)
# and creates a DRAFT release with the files. The draft only becomes public when someone reviews
# and publishes it manually.
#
# Trigger: pushing a vX.Y.Z tag (or manually, only to test the builds - in
# that case no release is created).
#
# Third-party actions are pinned by commit hash (not by tag, which can be
# moved).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (GNU) and MinGW-w64
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          # windres and the linker of the GNU toolchain come from MinGW-w64
          if (-not (Get-Command windres -ErrorAction SilentlyContinue)) {
            if (Test-Path C:\mingw64\bin\windres.exe) {
              "C:\mingw64\bin" >> $env:GITHUB_PATH
            } else {
              C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed `
                mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils
              "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH
            }
          }

      - name: Tag matches the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $versao = (Select-String -Path rust/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$versao" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match version $versao in Cargo.toml."
          }

      # downloads and verifies the official OpenVPN MSI, runs the tests, builds and
      # checks the binary (the same script as the local build)
      - name: Release build
        shell: pwsh
        run: ./rust/build-release.ps1

      - name: Assemble the files
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item rust/target/release/vpn.exe dist/VPN.exe
          $hash = (Get-FileHash -Algorithm SHA256 dist/VPN.exe).Hash
          "VPN.exe SHA-256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VPN-windows
          path: dist/
          if-no-files-found: error

  linux:
    # the oldest supported runner: the binary then runs on its glibc (2.35)
    # and on every newer distribution
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain and GTK 3
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential pkg-config libgtk-3-dev

      - name: Tag matches the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          versao=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          if [ "v$versao" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $versao in Cargo.toml." >&2
            exit 1
          fi

      # runs the tests, builds and checks the binary (same script as the local build)
      - name: Release build
        run: bash rust/build-release-linux.sh

      - name: Assemble the files
        run: |
          mkdir dist
          cp rust/target/release/vpn dist/VPN-linux-x86_64
          echo "VPN-linux-x86_64 SHA-256: \`$(sha256sum dist/VPN-linux-x86_64 | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VPN-linux
          path: dist/
          if-no-files-found: error

  macos:
    # Apple Silicon; builds for Intel too (universal VPN.app)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (Apple Silicon and Intel)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Tag matches the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          versao=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          if [ "v$versao" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $versao in Cargo.toml." >&2
            exit 1
          fi

      # OpenVPN and its libraries take a while to build: kept between runs,
      # keyed by the build script (which pins their versions and SHA-256)
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust/target/macos-deps
          key: macos-deps-${{ hashFiles('rust/build-release-macos.sh') }}

      # builds OpenVPN from the official sources, runs the tests, builds and
      # checks the app (same script as the local build)
      - name: Release build
        run: bash rust/build-release-macos.sh

      # the real thing on this Mac: one-time authorization, a connection to a
      # local test server, the dangerous .ovpn refused, nothing left behind
      - name: Connection test
        run: bash rust/test-macos-connection.sh

      - name: Assemble the files
        run: |
          mkdir dist
          cp rust/target/macos-dist/VPN-macos.zip dist/
          echo "VPN-macos.zip SHA-256: \`$(shasum -a 256 dist/VPN-macos.zip | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: VPN-macos
          path: dist/
          if-no-files-found: error

      # screenshots and logs of the connection test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: macos-connection-test
          path: rust/target/macos-test/
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, linux, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write # create the draft release
      id-token: write # sign the build provenance attestation (Sigstore)
      attestations: write # store the attestation in this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      # signed proof that each file was built by this workflow from this commit;
      # anyone can check it with: gh attestation verify <file> --repo Antxj/vpn
      - name: Build provenance attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/VPN.exe
            dist/VPN-linux-x86_64
            dist/VPN-macos.zip

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # tag pushed again (e.g. moved to another commit): the release already
          # exists, so do not create a second draft with the same name
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A release for $GITHUB_REF_NAME already exists; no new draft was created." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/VPN.exe dist/VPN-linux-x86_64 dist/VPN-macos.zip \
            THIRD-PARTY-LICENSES.txt LICENSE \
            --repo "$GITHUB_REPOSITORY" --draft \
            --title "VPN $GITHUB_REF_NAME" --generate-notes
