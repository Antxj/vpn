# Builds VPN.exe from the repository source in a clean GitHub environment
# and creates a DRAFT release with the files. The draft only becomes public
# when someone reviews and publishes it manually.
#
# Trigger: pushing a vX.Y.Z tag (or manually, only to test the build - in
# that case no release is created).
#
# Third-party actions are pinned by commit hash (not by tag, which can be
# moved).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write # create the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain (GNU) and MinGW-w64
        shell: pwsh
        run: |
          rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          rustup default stable-x86_64-pc-windows-gnu
          # windres and the linker of the GNU toolchain come from MinGW-w64
          if (-not (Get-Command windres -ErrorAction SilentlyContinue)) {
            if (Test-Path C:\mingw64\bin\windres.exe) {
              "C:\mingw64\bin" >> $env:GITHUB_PATH
            } else {
              C:\msys64\usr\bin\pacman.exe -S --noconfirm --needed `
                mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils
              "C:\msys64\mingw64\bin" >> $env:GITHUB_PATH
            }
          }

      - name: Tag matches the Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $versao = (Select-String -Path rust/Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$versao" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match version $versao in Cargo.toml."
          }

      # downloads and verifies the official OpenVPN MSI, runs the tests, builds and
      # checks the binary (the same script as the local build)
      - name: Release build
        shell: pwsh
        run: ./rust/build-release.ps1

      - name: Assemble the files
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item rust/target/release/vpn.exe dist/VPN.exe
          Copy-Item THIRD-PARTY-LICENSES.txt, LICENSE dist/
          $hash = (Get-FileHash -Algorithm SHA256 dist/VPN.exe).Hash
          "VPN.exe SHA-256: ``$hash``" >> $env:GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VPN
          path: dist/
          if-no-files-found: error

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # tag pushed again (e.g. moved to another commit): the release already
          # exists, so do not create a second draft with the same name
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            "A release for $env:GITHUB_REF_NAME already exists; no new draft was created." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          gh release create $env:GITHUB_REF_NAME dist/VPN.exe `
            dist/THIRD-PARTY-LICENSES.txt dist/LICENSE `
            --repo $env:GITHUB_REPOSITORY --draft `
            --title "VPN $env:GITHUB_REF_NAME" --generate-notes
