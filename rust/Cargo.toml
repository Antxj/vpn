[package]
name = "vpn"
version = "1.2.1"
edition = "2021"
description = "Connects to one or more OpenVPN VPNs with an automatic Google Authenticator (TOTP) token"
license = "GPL-3.0-or-later"
repository = "https://github.com/Antxj/vpn"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["wgpu", "default_fonts"] }
# O eframe 0.29 nao ativa o backend nativo DX12 do wgpu automaticamente.
wgpu = { version = "22.1", default-features = false, features = ["dx12"] }
tray-icon = "0.19"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
rqrr = { version = "0.10", default-features = false }
percent-encoding = "2"
hmac = "0.13"
sha1 = "0.11"
base32 = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
rfd = "0.17"
url = "2"
open = "5"
# account backup: password-derived key (Argon2id) + authenticated encryption (AES-256-GCM)
argon2 = { version = "0.5", default-features = false, features = ["alloc"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc"] }
getrandom = "0.4"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_Networking_WinHttp", "Win32_Security_Cryptography", "Win32_Security_Cryptography_Catalog", "Win32_Security_Cryptography_Sip", "Win32_Security_WinTrust", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock"] }

[dev-dependencies]
qrcode = "0.14"
ttf-parser = "0.25"

[build-dependencies]
embed-resource = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Argon2 is very slow without optimizations: keeps the backup tests quick
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3
